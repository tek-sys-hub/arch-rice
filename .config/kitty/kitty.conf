# Font
font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto

# Cursor
cursor_shape     beam
cursor_blink_interval 0.5
cursor           #f5e0dc
cursor_text_color #11111b

# Window (Catppuccin Mocha background)
background_opacity 0.85
background        #1e1e2e
foreground        #cdd6f4
window_padding_width 12

# Borders
active_border_color    #b4befe
inactive_border_color  #6c7086

# Tab bar
tab_bar_style          powerline
tab_powerline_style    slanted
active_tab_background  #cba6f7
active_tab_foreground  #11111b
inactive_tab_background #181825
inactive_tab_foreground #a6adc8

# Selection
selection_background   #f5e0dc
selection_foreground   #11111b

# URL underline color when hovering
url_color   #f5e0dc

# Catppuccin Mocha Palette
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

include theme.conf
