[manager]
keymap = [
  # ── Navigation ──────────────────────────────────────────────────────────
  { on = ["k"],         run = "arrow -1",        desc = "Move up" },
  { on = ["j"],         run = "arrow 1",         desc = "Move down" },
  { on = ["K"],         run = "arrow -5",        desc = "Move up 5" },
  { on = ["J"],         run = "arrow 5",         desc = "Move down 5" },
  { on = ["<Up>"],      run = "arrow -1",        desc = "Move up" },
  { on = ["<Down>"],    run = "arrow 1",         desc = "Move down" },
  { on = ["<C-u>"],     run = "arrow -50%",      desc = "Move up half page" },
  { on = ["<C-d>"],     run = "arrow 50%",       desc = "Move down half page" },
  { on = ["<C-b>"],     run = "arrow -100%",     desc = "Page up" },
  { on = ["<C-f>"],     run = "arrow 100%",      desc = "Page down" },
  { on = ["gg"],        run = "arrow -99999999", desc = "Go to top" },
  { on = ["G"],         run = "arrow 99999999",  desc = "Go to bottom" },

  # ── Pane navigation ─────────────────────────────────────────────────────
  { on = ["h"],         run = "leave",           desc = "Go to parent dir" },
  { on = ["l"],         run = "enter",           desc = "Enter dir / open file" },
  { on = ["<Left>"],    run = "leave",           desc = "Go to parent dir" },
  { on = ["<Right>"],   run = "enter",           desc = "Enter dir / open file" },
  { on = ["<Enter>"],   run = "open",            desc = "Open" },
  { on = ["<C-l>"],     run = "cd --interactive", desc = "CD interactively (fzf)" },

  # ── Tabs ────────────────────────────────────────────────────────────────
  { on = ["t"],         run = "tab_create --current", desc = "New tab (current dir)" },
  { on = ["["],         run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = ["]"],         run = "tab_switch 1  --relative", desc = "Next tab" },
  { on = ["1"],         run = "tab_switch 0", desc = "Tab 1" },
  { on = ["2"],         run = "tab_switch 1", desc = "Tab 2" },
  { on = ["3"],         run = "tab_switch 2", desc = "Tab 3" },
  { on = ["4"],         run = "tab_switch 3", desc = "Tab 4" },
  { on = ["5"],         run = "tab_switch 4", desc = "Tab 5" },
  { on = ["<C-w>"],     run = "tab_close",   desc = "Close tab" },

  # ── Selection ───────────────────────────────────────────────────────────
  { on = ["<Space>"],   run = ["select --state=none", "arrow 1"], desc = "Toggle select & move down" },
  { on = ["v"],         run = "visual_mode",     desc = "Enter visual mode" },
  { on = ["V"],         run = "select_all --state=true", desc = "Select all" },
  { on = ["<Esc>"],     run = ["escape", "select_all --state=false"], desc = "Cancel / deselect all" },

  # ── File operations ──────────────────────────────────────────────────────
  { on = ["o"],         run = "open",            desc = "Open file(s)" },
  { on = ["O"],         run = "open --interactive", desc = "Open with..." },
  { on = ["y"],         run = "yank",            desc = "Copy (yank)" },
  { on = ["x"],         run = "yank --cut",      desc = "Cut" },
  { on = ["p"],         run = "paste",           desc = "Paste" },
  { on = ["P"],         run = "paste --force",   desc = "Paste (overwrite)" },
  { on = ["-"],         run = "link",            desc = "Symlink absolute" },
  { on = ["d"],         run = "remove",          desc = "Move to trash" },
  { on = ["D"],         run = "remove --permanently", desc = "Delete permanently" },
  { on = ["a"],         run = "create",          desc = "Create file/dir" },
  { on = ["r"],         run = "rename --cursor=before_ext", desc = "Rename" },
  { on = ["R"],         run = "rename --empty",  desc = "Rename (clear)" },
  { on = ["."],         run = "hidden toggle",   desc = "Toggle hidden files" },
  { on = ["s"],         run = "search fd",       desc = "Search (fd)" },
  { on = ["S"],         run = "search rg",       desc = "Search contents (rg)" },
  { on = ["<C-s>"],     run = "escape --search", desc = "Cancel search" },
  { on = ["z"],         run = "jump zoxide",     desc = "Jump via zoxide" },
  { on = ["f"],         run = "jump fzf",        desc = "Jump via fzf" },

  # ── Sorting ─────────────────────────────────────────────────────────────
  { on = [",", "m"],    run = "sort modified --dir-first", desc = "Sort by modified" },
  { on = [",", "M"],    run = "sort modified --reverse --dir-first", desc = "Sort by modified (rev)" },
  { on = [",", "s"],    run = "sort size --dir-first", desc = "Sort by size" },
  { on = [",", "S"],    run = "sort size --reverse --dir-first", desc = "Sort by size (rev)" },
  { on = [",", "n"],    run = "sort natural --dir-first", desc = "Sort by name" },
  { on = [",", "N"],    run = "sort natural --reverse --dir-first", desc = "Sort by name (rev)" },
  { on = [",", "e"],    run = "sort extension --dir-first", desc = "Sort by extension" },

  # ── Shell / escape ───────────────────────────────────────────────────────
  { on = ["!"],         run = "shell --block",   desc = "Shell (block)" },
  { on = ["<C-r>"],     run = "refresh",         desc = "Refresh" },
  { on = ["~"],         run = "help",            desc = "Help" },
  { on = ["q"],         run = "quit",            desc = "Quit" },
  { on = ["Q"],         run = "quit --no-cwd-file", desc = "Quit (no cwd)" },

  # ── Goto shortcuts ───────────────────────────────────────────────────────
  { on = ["g", "h"],    run = "cd ~",            desc = "Go home" },
  { on = ["g", "c"],    run = "cd ~/.config",    desc = "Go ~/.config" },
  { on = ["g", "d"],    run = "cd ~/Downloads",  desc = "Go ~/Downloads" },
  { on = ["g", "D"],    run = "cd ~/Documents",  desc = "Go ~/Documents" },
  { on = ["g", "p"],    run = "cd ~/Pictures",   desc = "Go ~/Pictures" },
  { on = ["g", "v"],    run = "cd ~/Videos",     desc = "Go ~/Videos" },
  { on = ["g", "m"],    run = "cd ~/Music",      desc = "Go ~/Music" },
  { on = ["g", "/"],    run = "cd /",            desc = "Go /" },
  { on = ["g", "t"],    run = "cd /tmp",         desc = "Go /tmp" },
  { on = ["g", "r"],    run = "cd /",            desc = "Go root" },
]

[tasks]
keymap = [
  { on = ["<Esc>"], run = "close", desc = "Close task manager" },
  { on = ["<C-c>"], run = "close", desc = "Close task manager" },
  { on = ["w"],     run = "close", desc = "Close task manager" },
  { on = ["k"],     run = "arrow -1", desc = "Move up" },
  { on = ["j"],     run = "arrow 1",  desc = "Move down" },
  { on = ["<Up>"],  run = "arrow -1", desc = "Move up" },
  { on = ["<Down>"],run = "arrow 1",  desc = "Move down" },
  { on = ["<Enter>"], run = "inspect", desc = "Inspect task" },
  { on = ["x"],     run = "cancel",   desc = "Cancel task" },
]

[select]
keymap = [
  { on = ["<Esc>"],   run = "close",         desc = "Cancel" },
  { on = ["<C-c>"],   run = "close",         desc = "Cancel" },
  { on = ["<Enter>"], run = "close --submit", desc = "Submit" },
  { on = ["k"],       run = "arrow -1",      desc = "Move up" },
  { on = ["j"],       run = "arrow 1",       desc = "Move down" },
  { on = ["<Up>"],    run = "arrow -1",      desc = "Move up" },
  { on = ["<Down>"],  run = "arrow 1",       desc = "Move down" },
]

[input]
keymap = [
  { on = ["<Esc>"],    run = "close",          desc = "Cancel" },
  { on = ["<Enter>"],  run = "close --submit",  desc = "Submit" },
  { on = ["<C-c>"],    run = "close",          desc = "Cancel" },
  # Movement
  { on = ["<Left>"],   run = "move -1",        desc = "Move left" },
  { on = ["<Right>"],  run = "move 1",         desc = "Move right" },
  { on = ["<Home>"],   run = "move -999",      desc = "Start of line" },
  { on = ["<End>"],    run = "move 999",       desc = "End of line" },
  { on = ["<C-a>"],    run = "move -999",      desc = "Start of line" },
  { on = ["<C-e>"],    run = "move 999",       desc = "End of line" },
  # Editing
  { on = ["<Backspace>"], run = "backspace",   desc = "Backspace" },
  { on = ["<Delete>"],    run = "delete",      desc = "Delete" },
  { on = ["<C-u>"],       run = "kill bol",    desc = "Kill to start" },
  { on = ["<C-k>"],       run = "kill eol",    desc = "Kill to end" },
  { on = ["<C-w>"],       run = "kill backward", desc = "Kill word" },
  # Clipboard
  { on = ["<C-v>"],    run = "paste",          desc = "Paste" },
]

[completion]
keymap = [
  { on = ["<C-c>"],   run = "close",          desc = "Cancel" },
  { on = ["<Tab>"],   run = "close --submit",  desc = "Submit" },
  { on = ["<Up>"],    run = "arrow -1",        desc = "Move up" },
  { on = ["<Down>"],  run = "arrow 1",         desc = "Move down" },
  { on = ["<Enter>"], run = "close --submit",  desc = "Submit" },
]

[help]
keymap = [
  { on = ["<Esc>"],   run = "escape",  desc = "Back" },
  { on = ["<C-c>"],   run = "close",   desc = "Close" },
  { on = ["k"],       run = "arrow -1", desc = "Move up" },
  { on = ["j"],       run = "arrow 1",  desc = "Move down" },
  { on = ["<Up>"],    run = "arrow -1", desc = "Move up" },
  { on = ["<Down>"],  run = "arrow 1",  desc = "Move down" },
]
